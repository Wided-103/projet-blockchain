<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre IoT sur blockchain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
:root{--bg:#e9efee;--card:#f7faf9;--ink:#12313a;--mute:#5d7378;--line:#c4d3d1;--ok:#1d7a5a;--okbg:#d9eee5;--bad:#b4381a;--badbg:#f8ddd5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f24;--card:#163038;--ink:#e3eeed;--mute:#93aeb2;--line:#2c4a52;--ok:#5fd0a3;--okbg:#17463a;--bad:#ff9a7a;--badbg:#53261a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:32px 16px 64px}
main{max-width:860px;margin:0 auto}
h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;margin:0 0 8px;font-weight:600;letter-spacing:-.02em}
h1 b{color:var(--ok)} h1 b.bad{color:var(--bad)}
.sub{color:var(--mute);margin:0 0 24px;max-width:60ch}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:32px}
button{font:inherit;font-weight:500;padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.src{color:var(--mute);font-size:.9rem;margin-left:auto}
ol{list-style:none;margin:0;padding:0}
li{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:14px}
li::before{content:"";position:absolute;left:21px;top:44px;bottom:-2px;width:2px;background:var(--ok)}
li.bad::before{background:repeating-linear-gradient(var(--bad) 0 5px,transparent 5px 10px)}
li:last-child::before{display:none}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
li.bad .dot{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
li.bad .card{border-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.vals{font-weight:600}
.meta{color:var(--mute);font-size:.88rem}
.tag{font-size:.85rem;font-weight:600;color:var(--ok)} li.bad .tag{color:var(--bad)}
.hash{font:400 .82rem/1.6 "IBM Plex Mono",monospace;color:var(--mute);margin-top:6px;word-break:break-all}
.hash span{color:var(--ink)} li.bad .hash .calc{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){li.bad .card{animation:shake .4s}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<main>
  <h1 id="titre">Chargement…</h1>
  <p class="sub">Chaque mesure envoyée par un nœud IoT est enregistrée sous forme de hash sur la blockchain. Le tableau de bord recalcule le hash de la donnée et le compare à celui de la chaîne.</p>
  <div class="bar">
    <button id="btnFalsifier">Falsifier une mesure</button>
    <button id="btnReset" class="ghost">Rétablir les données</button>
    <span class="src" id="src"></span>
  </div>
  <ol id="liste" aria-live="polite"></ol>
</main>
<script>
const court = (s, a = 6, b = 4) => s.slice(0, a) + "…" + s.slice(-b);
let data = [], original = [], source = "";

function demo() {
  const noeuds = ["0x70997970C51812dc3A010C7d01b50e0d17dc79C8", "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC", "0x90F79bf6EB2c4f870365E785982E1f101E93b906"];
  const now = Math.floor(Date.now() / 1000);
  return Array.from({ length: 9 }, (_, i) => {
    const noeud = noeuds[i % 3];
    const donnee = JSON.stringify({ noeud, temperature: +(21 + Math.random() * 8).toFixed(1), humidite: Math.round(42 + Math.random() * 25), ts: now - (9 - i) * 60 });
    const hashChaine = ethers.keccak256(ethers.toUtf8Bytes(donnee));
    return { i, noeud, donnee, hashChaine, date: now - (9 - i) * 60 };
  });
}

async function charger() {
  try {
    const r = await fetch("dashboard-data.json");
    if (!r.ok) throw new Error();
    data = await r.json();
    source = "Données du simulateur";
  } catch {
    data = demo();
    source = "Données de démonstration";
  }
  original = JSON.parse(JSON.stringify(data));
  render();
}

function render() {
  const rows = data.map(d => {
    const calc = ethers.keccak256(ethers.toUtf8Bytes(d.donnee));
    let p = {};
    try { p = JSON.parse(d.donnee); } catch {}
    return { ...d, calc, ok: calc === d.hashChaine, p };
  });
  const bad = rows.filter(r => !r.ok).length;
  const titre = document.getElementById("titre");
  titre.innerHTML = bad === 0
    ? `Les <b>${rows.length} mesures</b> sont intactes`
    : `<b class="bad">${bad} mesure${bad > 1 ? "s" : ""} falsifiée${bad > 1 ? "s" : ""}</b> sur ${rows.length}`;
  document.getElementById("src").textContent = source;
  document.getElementById("liste").innerHTML = rows.map(r => `
    <li class="${r.ok ? "" : "bad"}">
      <div class="dot" aria-hidden="true">${r.ok ? "✓" : "!"}</div>
      <div class="card">
        <div class="top">
          <span class="vals">${r.p.temperature ?? "?"} °C · ${r.p.humidite ?? "?"} % d'humidité</span>
          <span class="tag">${r.ok ? "Intégrité vérifiée" : "Donnée modifiée après l'enregistrement"}</span>
        </div>
        <div class="meta">Mesure ${r.i} · nœud ${court(r.noeud)} · ${new Date(r.date * 1000).toLocaleTimeString("fr-FR")}</div>
        <div class="hash">Sur la chaîne : <span>${court(r.hashChaine, 12, 8)}</span><br>
          Recalculé : <span class="calc">${court(r.calc, 12, 8)}</span></div>
      </div>
    </li>`).join("");
}

document.getElementById("btnFalsifier").onclick = () => {
  const cible = data.find(d => { try { return ethers.keccak256(ethers.toUtf8Bytes(d.donnee)) === d.hashChaine; } catch { return false; } });
  if (!cible) return;
  const p = JSON.parse(cible.donnee);
  p.temperature = 99;
  cible.donnee = JSON.stringify(p);
  render();
};
document.getElementById("btnReset").onclick = () => { data = JSON.parse(JSON.stringify(original)); render(); };
charger();
</script>
</body>
</html>
